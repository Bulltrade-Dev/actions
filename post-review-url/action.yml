name: Post Review URL to PR
inputs:
  url:
    required: true
  pr-number:
    required: true
  repo:
    required: true
  token:
    required: true
runs:
  using: composite
  steps:
    - name: Post review URL comment (once)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        URL: ${{ inputs.url }}
        PR_NUMBER: ${{ inputs.pr-number }}
        REPO: ${{ inputs.repo }}
      run: |
        existing=$(curl -sSf \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
          | jq '[.[] | select(.body | startswith("<!-- review-url -->"))] | length')
        if [[ "$existing" == "0" ]]; then
          curl -sSf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "{\"body\":\"<!-- review-url -->\n$URL\"}" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments"
        fi
