name: Build and Push Image
inputs:
  image-path:
    description: 'Path after registry, e.g. bulltrade/gamelight/backend'
    required: true
  context:
    description: 'Docker build context directory'
    required: true
  registry:
    required: true
  registry-username:
    required: true
  registry-password:
    required: true
  registry-proxy:
    required: false
    default: ''
outputs:
  image:
    value: ${{ steps.meta.outputs.image }}
runs:
  using: composite
  steps:
    - id: meta
      shell: bash
      env:
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        SHA="${PR_HEAD_SHA:-$GITHUB_SHA}"
        echo "image=${{ inputs.registry }}/${{ inputs.image-path }}:${SHA:0:8}" >> $GITHUB_OUTPUT
    - uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}
    - uses: docker/setup-buildx-action@v3
    - shell: bash
      env:
        IMAGE: ${{ steps.meta.outputs.image }}
        CONTEXT: ${{ inputs.context }}
        REGISTRY_PROXY: ${{ inputs.registry-proxy }}
      run: |
        for i in 1 2 3 4 5; do
          docker buildx build \
            --push \
            --tag "$IMAGE" \
            ${REGISTRY_PROXY:+--build-arg "CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX=${REGISTRY_PROXY}/library"} \
            "$CONTEXT" && exit 0
          echo "attempt $i failed, retrying in $((i * 15))s..."
          sleep $((i * 15))
        done
        echo "all build+push attempts failed"
        exit 1
