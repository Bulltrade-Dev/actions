name: Jira Link
inputs:
  jira-project-key:
    required: true
  jira-base-url:
    required: true
  pr-number:
    required: true
  pr-title:
    required: true
  pr-branch:
    required: true
  pr-body:
    required: false
    default: ''
  repo:
    required: true
  token:
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        KEY: ${{ inputs.jira-project-key }}
        BASE_URL: ${{ inputs.jira-base-url }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BRANCH: ${{ inputs.pr-branch }}
        PR_BODY: ${{ inputs.pr-body }}
        REPO: ${{ inputs.repo }}
      run: |
        match=$(echo "$PR_BRANCH $PR_TITLE" | grep -oiE "${KEY}-[0-9]+" | head -1 | tr '[:lower:]' '[:upper:]' || true)
        [[ -z "$match" ]] && exit 0
        url="${BASE_URL}/${match}"
        if echo "$PR_BODY" | grep -qF "$url"; then exit 0; fi
        link="**Jira:** [${match}](${url})"
        if [[ -n "$PR_BODY" ]]; then
          new_body="${link}"$'\n\n'"${PR_BODY}"
        else
          new_body="$link"
        fi
        curl -sSf \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          -H "Content-Type: application/json" \
          -X PATCH \
          --data "$(jq -n --arg body "$new_body" '{"body": $body}')" \
          "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER"
